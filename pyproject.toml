[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "freedomllm"
version = "0.0.1"
authors = [{ name = "Yeongu Choe", email = "yeongu.choe@icloud.com" }]
requires-python = ">=3.12"
dependencies = [
    "torch",
    "triton==3.9.0",
    "helion==1.5.2",
    "safetensors",
    "fastapi[standard]==0.162.2",
]

[dependency-groups]
test = ["pytest==9.2.0", "numpy==2.5.4"]

[tool.setuptools]
py-modules = ["model_loader"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
strict_markers = true
markers = ["model_loader"]
